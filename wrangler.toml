# Cloudflare Workers (free plan). Not deployed from this repo by default.
name = "dead-mans-switch"
main = "src/worker/index.ts"
compatibility_date = "2026-11-01"

[assets]
directory = "dist/web"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[kv_namespaces]]
binding = "DMS_KV"
id = "replace-with-your-kv-namespace-id"

[triggers]
crons = ["*/15 * * * *"]

[vars]
DMS_BASE_URL = "https://dead-mans-switch.example.workers.dev"
DMS_MAIL_FROM = "Dead Man's Switch <switch@example.com>"
# RESEND_API_KEY is a secret: wrangler secret put RESEND_API_KEY

# Optional: a rate limit on witness and letter links that survives restarts and is
# shared across Worker isolates. Nothing changes until you remove the leading "#"
# characters below. Without this binding the Worker keeps its in-memory limiter,
# which resets on every restart or new isolate.
#
# Checked against the Cloudflare docs (Workers > Runtime APIs > Bindings > Rate Limiting):
# the binding is a `[[ratelimits]]` table with a `[ratelimits.simple]` sub-table. The older
# `[[unsafe.bindings]]` with `type = "ratelimit"` is not the documented form.
# `limit` is the request threshold per `period` seconds for one key, counted per Cloudflare
# location, and requests can exceed it. `period` must be 10 or 60. `namespace_id` is a string
# holding a positive integer, unique within your account.
# The Worker answers 429 with Retry-After set to `period`. Keep `limit = 60` and
# `period = 60` to match the default of 60 requests a minute.
#
# [[ratelimits]]
# name = "DMS_RATE_LIMITER"
# namespace_id = "1001"
#
#   [ratelimits.simple]
#   limit = 60
#   period = 60
